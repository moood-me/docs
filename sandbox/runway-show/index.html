  launch(){this.state='out';this.d=0;this.s=0.35;this.heading=0;this.group.visible=true;this.skirts.forEach(k=>{k.ph=null;k.sway.set(0,0);k.vel.set(0,0)})}
  rotLeg(bone,ang){bone.parent.getWorldQuaternion(_q);_a.set(Math.sin(this.heading),0,Math.cos(this.heading)).applyQuaternion(_q.invert());bone.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(_a,ang))}
  step(dt,t){if(this.state==='wait')return;let curve=OUT,Lc=OUT_L;
    if(this.state==='out'){const rem=Lc-this.d,tg=rem>1?1:Math.max(0.22,rem);this.s+=(tg-this.s)*Math.min(1,dt*3);this.d+=this.kind.walkV*this.s*dt;if(this.d>=Lc-0.005){this.d=Lc;this.state='pose';this.poseT=0}}
    else if(this.state==='pose'){this.s+=(0-this.s)*Math.min(1,dt*5);this.poseT+=dt;if(this.poseT>POSE_T){this.state='back';this.d=0}}
    else{curve=BACK;Lc=BACK_L;const tg=this.d<1.7?0.62:1;this.s+=(tg-this.s)*Math.min(1,dt*3);this.d+=this.kind.walkV*this.s*dt;if(this.d>=Lc){this.state='wait';this.group.visible=false;return}}
    const u=Math.min(1,this.d/Lc),p=curve.getPointAt(u),tn=curve.getTangentAt(u);let hd=Math.atan2(tn.x,tn.z);if(this.state==='pose')hd=0;
    if(this.fixed){p.set(this.fixed.x,0,this.fixed.z);this.poseT=0;this.heading=hd=this.fixed.h??0}
    this.heading=angLerp(this.heading,hd,Math.min(1,dt*7));
    this.group.position.set(p.x,RUN_TOP-this.kind.floor+this.lift,p.z);this.group.rotation.y=this.heading;
    this.walk.weight=this.s;this.idle.weight=1-this.s;this.walk.timeScale=this.s*this.kind.walkV/this.kind.clipV;this.mixer.update(dt);
    this.group.updateMatrixWorld(true);
    const ad=0.06*this.s;this.rotLeg(this.legs.L[0],-ad);this.rotLeg(this.legs.R[0],ad);this.rotLeg(this.arms.L,this.armOut);this.rotLeg(this.arms.R,-this.armOut);this.legs.L[0].updateMatrixWorld(true);this.legs.R[0].updateMatrixWorld(true);
    if(this.skirts.length){const hl=this.group.worldToLocal(this.hips.getWorldPosition(new V3()));
      for(const k of this.skirts){const vx=k.ph?(hl.x-k.ph.x)/dt:0,vz=k.ph?(hl.z-k.ph.z)/dt:0;k.ph=hl.clone();
        const tx=-vx*0.05*k.flex,tz=(-vz*0.05-this.s*this.kind.walkV*0.05)*k.flex;
        k.vel.x+=((tx-k.sway.x)*40-k.vel.x*7)*dt;k.vel.y+=((tz-k.sway.y)*40-k.vel.y*7)*dt;k.sway.addScaledVector(k.vel,dt);k.sway.clampLength(0,0.15);
        k.mesh.position.copy(hl);k.mesh.updateMatrixWorld();
        for(let j=0;j<4;j++){k.mesh.worldToLocal(this.legs.L[j].getWorldPosition(k.U.uL.value[j]));k.mesh.worldToLocal(this.legs.R[j].getWorldPosition(k.U.uR.value[j]))}
        for(const a of[k.U.uL.value,k.U.uR.value])a[3].sub(a[2]).normalize().multiplyScalar(0.12).add(a[3]);
        k.U.uTime.value=t;k.U.uSway.value.copy(k.sway)}}}
}
let launchT=0;const queue=[];
function sched(dt){launchT-=dt;if(launchT<=0&&queue.length){const a=queue[0];if(a.state==='wait'){queue.push(queue.shift());a.launch();launchT=LAUNCH}}}

/* ---------- camera direction ---------- */
const shots=['press','side','wide','front','sun','press','orbit','top','hem'];
let shotI=-1,shotT=0,shotDur=6,subj=null,cut=true,camFov=30,mode='auto',lastInteract=0;
const camPos=new V3(),camTgt=new V3(0,1,-3);
function pick(pref){let best=null,bs=1e9;for(const a of actors)if(a.state==='out'){const sc=Math.abs(OUT_L-a.d-pref);if(sc<bs){bs=sc;best=a}}return best||actors.find(a=>a.state!=='wait')||actors[0]}
function nextShot(){shotI=(shotI+1)%shots.length;shotT=0;cut=true;const s=shots[shotI];shotDur=s==='wide'?7.5:s==='orbit'?7:6;
  subj={press:10,front:10,side:8,hem:12,top:6,sun:16}[s];subj=subj!==undefined?pick(subj):null}
function shotEval(s,t){const P=new V3(),T=new V3();let fov=30;const ap=subj?subj.group.position:new V3(0,RUN_TOP,0);
  switch(s){
    case'press':{P.set(1.6,2.25,15.8);T.set(ap.x,ap.y+1.2,ap.z);fov=2*Math.atan(1.45/P.distanceTo(T))/D2R;break}
    case'side':P.set(ap.x-3.6,ap.y+0.65,ap.z+0.9);T.set(ap.x,ap.y+1.0,ap.z+0.25);fov=34;break;
    case'wide':{const k=t/7.5;P.set(lerp(14,9.5,k),lerp(6.8,3.6,k),lerp(17,10.5,k));T.set(0,1.0,-3);fov=38;break}
    case'front':P.set(ap.x-0.9,ap.y+0.25,ap.z+3.1);T.set(ap.x,ap.y+0.95,ap.z);fov=40;break;
    case'sun':{const dir=new V3(-sunDir.x,0,-sunDir.z).normalize().applyAxisAngle(UPV,0.42);P.copy(ap).addScaledVector(dir,5.8);P.y=ap.y+0.55;T.set(ap.x,ap.y+1.15,ap.z);fov=34;break}
    case'orbit':{const c=new V3(0.05,RUN_TOP+1.15,9.35),g=-0.2-t*0.16;P.set(c.x+Math.sin(g)*4.2,c.y+0.25,c.z+Math.cos(g)*4.2);T.copy(c);fov=30;break}
    case'top':P.set(ap.x+0.5,ap.y+7.5,ap.z+2.2);T.set(ap.x,ap.y+0.6,ap.z);fov=32;break;
    case'hem':P.set(ap.x-1.5,RUN_TOP+0.18,ap.z+1.1);T.set(ap.x,RUN_TOP+0.45,ap.z-0.1);fov=42;break}
  return{P,T,fov}}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;controls.minDistance=1.2;controls.maxDistance=90;
controls.addEventListener('start',()=>{if(mode!=='free'){mode='free';controls.target.copy(camTgt)}lastInteract=performance.now()});
controls.addEventListener('change',()=>{if(mode==='free')lastInteract=performance.now()});
function camUpdate(dt){
  if(mode==='free'){controls.update();if(performance.now()-lastInteract>12000){mode='auto';nextShot()}return}
  shotT+=dt;if(shotT>shotDur||(subj&&subj.state==='wait'))nextShot();
  const e=shotEval(shots[shotI],shotT);
  if(cut){camPos.copy(e.P);camTgt.copy(e.T);camFov=e.fov;cut=false}else{const k=1-Math.exp(-dt*3.5);camPos.lerp(e.P,k);camTgt.lerp(e.T,1-Math.exp(-dt*5));camFov=lerp(camFov,e.fov,k)}
  camera.position.copy(camPos);camera.lookAt(camTgt);camera.fov=camFov;camera.updateProjectionMatrix()}

/* ---------- load ---------- */
function clipSpeed(clip,base){const m=SkeletonUtils.clone(base),g=new THREE.Group();g.add(m);const mx=new THREE.AnimationMixer(m);mx.clipAction(clip).play();let toe=null;m.traverse(o=>{if(o.isBone&&bn(o.name)==='LeftToeBase')toe=o});if(!toe)return 1.2;
  const N=160,S=[],v=new V3();for(let i=0;i<=N;i++){mx.setTime(clip.duration*i/N);g.updateMatrixWorld(true);toe.getWorldPosition(v);S.push([clip.duration*i/N,v.y,v.z])}
  const minY=Math.min(...S.map(s=>s[1])),vs=[];for(let i=0;i<N;i++)if(S[i][1]<minY+0.02&&S[i+1][1]<minY+0.02)vs.push(-(S[i+1][2]-S[i][2])/(S[i+1][0]-S[i][0]));
  vs.sort((a,b)=>a-b);const med=vs.length?vs[vs.length>>1]:1.2;return med>0.4&&med<2.5?med:1.2}
const HOSTS=['./models/'];
async function loadGLB(f){const l=new GLTFLoader();for(const u of HOSTS){try{return await l.loadAsync(u+f)}catch(e){console.warn('load failed',u+f,e)}}throw new Error('model')}
function retarget(clip,srcRoot,dstRoot,fps=30){
  const src=SkeletonUtils.clone(srcRoot),gs=new THREE.Group();gs.add(src);gs.updateMatrixWorld(true);dstRoot.updateMatrixWorld(true);
  const bS={};src.traverse(o=>{if(o.isBone)bS[bn(o.name)]=o});const dB=[];dstRoot.traverse(o=>{if(o.isBone)dB.push(o)});
  const restS={},restD=new Map();for(const k in bS)restS[k]=bS[k].getWorldQuaternion(new THREE.Quaternion());dB.forEach(b=>restD.set(b,b.getWorldQuaternion(new THREE.Quaternion())));
  const hS=bS.Hips,hD=dB.find(b=>bn(b.name)==='Hips'),hS0=hS.getWorldPosition(new V3()),hD0=hD.getWorldPosition(new V3()),ratio=hD0.y/hS0.y,hPinv=hD.parent.matrixWorld.clone().invert();
  const mx=new THREE.AnimationMixer(src);mx.clipAction(clip).play();
  const n=Math.max(2,Math.round(clip.duration*fps)+1),times=new Float32Array(n),Q=new Map(dB.map(b=>[b,new Float32Array(n*4)])),HP=new Float32Array(n*3);
  const wq=new Map(),tq=new THREE.Quaternion(),pq=new THREE.Quaternion(),p=new V3();
  for(let i=0;i<n;i++){const t=clip.duration*i/(n-1);times[i]=t;mx.setTime(t);gs.updateMatrixWorld(true);wq.clear();
    for(const b of dB){const s=bS[bn(b.name)];let W;
      if(s){W=s.getWorldQuaternion(new THREE.Quaternion()).multiply(tq.copy(restS[bn(b.name)]).invert()).multiply(restD.get(b))}else{W=null}
      const par=b.parent,PW=wq.get(par)||par.getWorldQuaternion(pq.clone());
      let L;if(W)L=PW.clone().invert().multiply(W);else{L=b.quaternion.clone();W=PW.clone().multiply(L)}
      wq.set(b,W);Q.get(b).set([L.x,L.y,L.z,L.w],i*4)}
    hS.getWorldPosition(p);p.sub(hS0).multiplyScalar(ratio).add(hD0).applyMatrix4(hPinv);HP.set([p.x,p.y,p.z],i*3)}
  const tracks=dB.map(b=>new THREE.QuaternionKeyframeTrack(b.name+'.quaternion',times,Q.get(b)));tracks.push(new THREE.VectorKeyframeTrack(hD.name+'.position',times,HP));
  return new THREE.AnimationClip(clip.name,clip.duration,tracks)}

let simT=0;const clock=new THREE.Clock();
const LINEUP=location.hash==='#lineup';
function frame(){requestAnimationFrame(frame);fitSize();const dt=Math.min(Math.max(clock.getDelta(),1e-4),1/20);simT+=dt;
  if(LINEUP){actors.forEach((a,i)=>{a.group.visible=true;a.state='pose';a.fixed={x:(i-(actors.length-1)/2)*0.95,z:6};a.step(dt,simT)});
    if(mode!=='free'){const c=window.__cam||{p:[0,1.6,17],l:[0,1.2,6],f:38};camera.position.fromArray(c.p);camera.lookAt(...c.l);camera.fov=c.f;camera.updateProjectionMatrix()}else controls.update();composer.render();return}
  sched(dt);for(const a of actors)a.step(dt,simT);camUpdate(dt);vig.uniforms.uTime.value=simT%100;composer.render()}
try{
  const PEOPLE=[['Remy',1.84],['Peasant Girl',1.72],['Ch46_nonPBR',1.68],['Ch34_nonPBR',1.72],['Ch13_nonPBR',1.76],['Ch02_nonPBR',1.73],['Ch42_nonPBR',1.82]];
  const loadUp=f=>new GLTFLoader().loadAsync('./models/'+f+'.glb').catch(e=>{console.warn('upload failed',f,e);return null});
  const [gltf,girl,...ups]=await Promise.all([loadGLB('Xbot.glb'),loadGLB('Michelle.glb'),...PEOPLE.map(p=>loadUp(p[0]))]);new THREE.Group().add(gltf.scene);
  const find=n=>gltf.animations.find(a=>a.name.toLowerCase()===n)||gltf.animations.find(a=>a.name.toLowerCase().includes(n));
  const SRC={walk:find('walk'),idle:find('idle')};
  function makeKind(sc,height){new THREE.Group().add(sc);
    if(height){const c0=bodyCloud(sc);let lo=1e9,hi=-1e9;for(let i=1;i<c0.length;i+=3){lo=Math.min(lo,c0[i]);hi=Math.max(hi,c0[i])}sc.scale.multiplyScalar(height/(hi-lo));sc.updateMatrixWorld(true)}
    const cloud=bodyCloud(sc);let floor=1e9;for(let i=1;i<cloud.length;i+=3)floor=Math.min(floor,cloud[i]);
    const clips={walk:retarget(SRC.walk,gltf.scene,sc),idle:retarget(SRC.idle,gltf.scene,sc)};const clipV=clipSpeed(clips.walk,sc);
    return{base:sc,cloud,floor,clips,clipV,walkV:clipV*0.97}}
  KIND0=makeKind(girl.scene);
  const girls=[],people=[];
  for(const l of LOOKS){try{girls.push(new Actor(l))}catch(e){console.error('look failed',e)}}
  ups.forEach((g,i)=>{if(!g)return;try{people.push(new Actor({armOut:4},makeKind(g.scene,PEOPLE[i][1])))}catch(e){console.error('person failed',PEOPLE[i][0],e)}});
  for(let i=0;i<Math.max(girls.length,people.length);i++){if(people[i])actors.push(people[i]);if(girls[i])actors.push(girls[i])}
  actors.forEach(a=>queue.push(a));
  for(let i=0;i<36*30;i++){const dt=1/30;simT+=dt;sched(dt);for(const a of actors)a.step(dt,simT)}
  nextShot();camUpdate(0.016);
  renderer.compile(scene,camera);
  frame();
  setTimeout(()=>document.getElementById('fade').style.opacity=0,150);
}catch(e){console.error(e);document.getElementById('err').textContent='Не удалось загрузить 3D-модели. Проверьте подключение и обновите страницу.';document.getElementById('fade').style.opacity=0;frame()}
</script></body></html>
